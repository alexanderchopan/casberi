[package]
name = "casberi_key_account"
authors = ["casberi spike"]
compiler_version = ">=1.0.0"
type = "contract"

# aztec-nr moved out of aztec-packages at v6: its v6.0.0 source is tagged in aztec-labs-eng/aztec-node.
[dependencies]
aztec = { git = "https://github.com/aztec-labs-eng/aztec-node", tag = "v6.0.0", directory = "noir-projects/aztec-nr/aztec" }
ecdsa_public_key_note = { git = "https://github.com/aztec-labs-eng/aztec-node", tag = "v6.0.0", directory = "noir-projects/aztec-nr/ecdsa-public-key-note" }
sha256 = { tag = "v0.3.0", git = "https://github.com/noir-lang/sha256" }
