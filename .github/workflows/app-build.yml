# Builds the app from a clean checkout and runs its unit tests, on GitHub's
# own machine: proof that the tree builds for somebody who is not the
# developer.
#
# Runs on every push that touches the app, what it vendors or how it is
# built, and by hand. About fifteen minutes once TDLib is cached; the first
# green run was 2026-11-12, on the image's iPhone 18 Pro simulator.
#
# What a clean machine needs that the repo does not carry:
#   - TDLib, built from Telegram's source at a pinned commit by
#     scripts/tdlib.sh (about an hour; cached here by that script's hash).
#     With no Telegram app id in the Keychain its header says 0, and the
#     Telegram seat says it cannot sign in. The app still builds.
#   - Aztec's prover and the engine page, fetched and built by
#     scripts/aztec-engine.sh (scripts/xcb.sh runs it before the build).
#
# Nothing is signed and nothing is uploaded: this is a simulator build.
name: App build

on:
  push:
    branches: [main]
    paths:
      - 'Casberi/**'
      - 'Vendor/**'
      - 'tools/aztec-engine/**'
      - 'scripts/tdlib.sh'
      - 'scripts/aztec-engine.sh'
      - 'scripts/xcb.sh'
      - '.github/workflows/app-build.yml'
  workflow_dispatch:

concurrency:
  group: app-build-${{ github.ref_name }}
  cancel-in-progress: true

# Least privilege: this workflow only reads the repository.
permissions:
  contents: read

jobs:
  build:
    # The Xcode 27 image; the app is built with Xcode 27.2.
    runs-on: xcode-27
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Xcode 27.2
        run: |
          sudo xcode-select -s /Applications/Xcode_27.2.app
          xcodebuild -version

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Tools TDLib needs
        run: |
          for tool in cmake gperf; do
            command -v "$tool" >/dev/null || brew install "$tool"
          done

      # Restored and saved as two steps, so an hour of TDLib is kept even when
      # a later step fails (the combined action saves only on a green job, and
      # the first run lost it that way).
      - name: TDLib cache
        id: tdlib-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/Library/Caches/casberi/tdlib
          key: tdlib-${{ runner.os }}-xcode27.2-${{ hashFiles('scripts/tdlib.sh') }}

      - name: TDLib
        run: scripts/tdlib.sh

      - name: Keep TDLib
        if: steps.tdlib-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/Library/Caches/casberi/tdlib
          key: ${{ steps.tdlib-cache.outputs.cache-primary-key }}

      - name: Aztec cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            Casberi/vendor/aztec
            tools/aztec-engine/node_modules
          key: aztec-${{ runner.os }}-${{ hashFiles('scripts/aztec-engine.sh', 'tools/aztec-engine/package-lock.json') }}

      # A NAMED simulator, never the generic destination: generic builds the
      # x86_64 slice as well, and TDLib, Tor and Aztec's prover carry arm64
      # only (the first run compiled everything and failed at that link).
      - name: Pick a simulator
        run: |
          # `|| true` on each lookup: the step runs under `bash -e`, where an
          # assignment whose grep matches nothing ends the script before the
          # line that would have printed why (the second run died that way).
          xcrun simctl list devices available > "$RUNNER_TEMP/sims.txt"
          device=$(grep -oE 'iPhone 17 Pro \([0-9A-F-]{36}\)' "$RUNNER_TEMP/sims.txt" | head -1 | grep -oE '[0-9A-F-]{36}' || true)
          # The image's own iPhone, whichever it carries, when it has no 17 Pro.
          [ -n "$device" ] || device=$(grep -E '^ +iPhone ' "$RUNNER_TEMP/sims.txt" | grep -oE '[0-9A-F-]{36}' | head -1 || true)
          if [ -z "$device" ]; then cat "$RUNNER_TEMP/sims.txt"; echo "no iPhone simulator on this image"; exit 1; fi
          grep "$device" "$RUNNER_TEMP/sims.txt"
          echo "SIM=$device" >> "$GITHUB_ENV"

      - name: Build for the simulator
        run: |
          scripts/xcb.sh -project Casberi/Casberi.xcodeproj -scheme Casberi \
            -destination "id=$SIM" \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            CODE_SIGNING_ALLOWED=NO build

      - name: Unit tests
        run: |
          scripts/xcb.sh test -project Casberi/Casberi.xcodeproj -scheme Casberi \
            -destination "id=$SIM" \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            -only-testing:CasberiTests CODE_SIGNING_ALLOWED=NO
