# Is the live casberi.app still the site in this repo? Hourly, from outside.
#
# WHY THIS EXISTS. `pages.yml` makes a commit the only way to change the site
# on GitHub's side, but the domain and its DNS live elsewhere, and whoever
# takes those can serve a look-alike with another download link. This reads
# the live site and its DNS and fails when either stops matching the repo
# (`scripts/site-integrity.py` says exactly what it checks). A failed scheduled
# run emails the repo owner, which is the alarm.
#
# A deploy in flight would read as a mismatch, so a failure is tried once more
# five minutes later against a fresh pull before it counts.
name: Site integrity

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Self-test
        run: python3 scripts/site-integrity.py --self-test
      - name: Live site matches the repo
        run: |
          python3 scripts/site-integrity.py && exit 0
          echo "Retrying in five minutes, in case a deploy was in flight."
          sleep 300
          git pull --ff-only
          python3 scripts/site-integrity.py
