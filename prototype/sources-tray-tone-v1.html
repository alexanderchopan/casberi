<meta charset="utf-8">
<title>Sources tray — tone</title>
<style>
  /* Real tokens, DesignTokens.swift
     page          #000000 / themed white
     surfaceSheet  #111113 / #ffffff
     surfaceWell   #080809 / #e9e9ef
     fillFaint     #ffffff0a / #00000008
     textPrimary   #ffffff / #000000
     textSecondary #ebebf599 / #3c3c43d6
     textTertiary  #ebebf57e / #3c3c43bd
     tint          #0a84ff
     cardShadow    #0000008c / #0000001f
     Space  s1 4  s2 10  s3 14  s4 18  s5 24  s6 32
     Radius card 10, sheet 16
     label11 11/15 medium · label12 12/16 medium · heading22 22/28 bold rounded
     SourcesTray: columns 5, icon 44, chip 52, nameHeight 28,
                  overline 15 + gap 5, cardPadTop 8, cardPadBottom 6, rowGap 10 */

  :root { color-scheme: dark; }
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
    background: #0b0b0d;
    color: #ebebf5cc;
    padding: 32px 28px 64px;
    -webkit-font-smoothing: antialiased;
  }
  body.light { background: #f2f2f7; color: #3c3c43d6; }

  h1 { font: 700 22px/28px ui-rounded, -apple-system, system-ui; color: #fff; letter-spacing: 0; }
  body.light h1 { color: #000; }
  .sub { margin-top: 6px; max-width: 90ch; font-size: 13px; opacity: .72; }

  .bar { display: flex; gap: 10px; align-items: center; margin: 18px 0 26px; flex-wrap: wrap; }
  button {
    font: 500 13px/1 inherit; color: inherit; cursor: pointer;
    background: #ffffff14; border: 0; border-radius: 9999px; padding: 9px 15px;
  }
  body.light button { background: #00000010; }
  button.on { background: #0a84ff; color: #fff; }

  .rail { display: flex; gap: 20px; align-items: flex-start; overflow-x: auto; padding-bottom: 18px; }

  .panel { flex: 0 0 auto; width: 402px; }
  .panel > h2 {
    font: 600 13px/18px inherit; color: #fff; margin-bottom: 2px;
  }
  body.light .panel > h2 { color: #000; }
  .panel > .note { font-size: 11.5px; line-height: 16px; opacity: .6; margin-bottom: 10px; min-height: 32px; }
  .swatches { font: 400 10.5px/14px ui-monospace, SFMono-Regular, monospace; opacity: .5; margin-bottom: 10px; }

  /* ---- the phone: page behind, tray in front ---------------------------- */

  .phone {
    position: relative; width: 402px; height: 762px; border-radius: 30px; overflow: hidden;
    background: #000;                       /* DS.page, dark default */
  }
  body.light .phone { background: #fff; }

  /* a hint of the feed underneath, so the tray has something to sit on */
  .behind { position: absolute; inset: 0; padding: 46px 18px; opacity: .30; }
  .behind .row { height: 56px; border-radius: 10px; background: #111113; margin-bottom: 10px; }
  body.light .behind .row { background: #ffffff; box-shadow: 0 1px 3px #0000001f; }
  .scrim { position: absolute; inset: 0; background: #00000059; }
  body.light .scrim { background: #00000029; }

  .tray {
    position: absolute; left: 0; right: 0; bottom: 0;
    border-radius: 16px 16px 0 0;           /* DS.Radius.sheet */
    padding: 32px 18px 32px;                /* s6 / s4 / s6 */
    background: var(--sheet);
  }
  .grabber {
    position: absolute; top: 8px; left: 50%; transform: translateX(-50%);
    width: 36px; height: 5px; border-radius: 3px; background: #ffffff40;
  }
  body.light .grabber { background: #00000040; }

  .title {
    font: 700 22px/28px ui-rounded, -apple-system, system-ui;
    color: #fff; margin-bottom: 18px;       /* s4 */
  }
  body.light .title { color: #000; }

  /* ---- the grid --------------------------------------------------------- */

  .rows { display: flex; flex-direction: column; gap: 10px; }   /* rowGap = s2 */

  .cardrow { display: flex; gap: 10px; }                        /* s2 between slots */
  .card {
    border-radius: 10px;                                        /* DS.Radius.card */
    padding: 8px 0 6px;                                         /* cardPadTop / Bottom */
    background: var(--card);
    box-shadow: var(--cardlift, none);
  }
  .cat-name {
    font: 600 11px/15px -apple-system, system-ui;               /* label11 semibold */
    color: #ebebf57e;                                           /* textTertiary */
    padding-left: 7px;                                          /* overlineInset */
    margin-bottom: 5px;                                         /* overlineGap */
    height: 15px; white-space: nowrap;
  }
  body.light .cat-name { color: #3c3c43bd; }

  .chips { display: flex; }
  .chip {
    width: 65.2px;                            /* (366 − 4×10) ÷ 5 */
    display: flex; flex-direction: column; align-items: center; gap: 4px;  /* s1 */
  }
  .ring {
    width: 52px; height: 52px; border-radius: 9999px;           /* chipSize */
    display: grid; place-items: center;
  }
  .ring.active { box-shadow: inset 0 0 0 2.5px #0a84ff; }
  .icon {
    width: 44px; height: 44px; border-radius: 9999px;           /* iconSize, circular */
    display: grid; place-items: center;
    font: 700 17px/1 ui-rounded, -apple-system, system-ui; color: #fff;
  }
  .chip-name {
    height: 28px;                                               /* nameHeight */
    font: 500 12px/16px -apple-system, system-ui;               /* label12 */
    color: #ebebf599;                                           /* textSecondary */
    text-align: center; padding: 0 1px; hyphens: none;
  }
  /* prd §201 — names never truncate; a long one scales instead of breaking */
  .chip-name.long { font-size: 10.5px; letter-spacing: -.2px; }
  body.light .chip-name { color: #3c3c43d6; }
  .chip.sel .chip-name { color: #fff; font-weight: 600; }
  body.light .chip.sel .chip-name { color: #000; }

  /* ---- the four treatments --------------------------------------------- */

  /* A — shipping today: sheet plane, cards recess to a well */
  .t-current { --sheet: #111113; --card: #080809; }
  body.light .t-current { --sheet: #ffffff; --card: #e9e9ef; }

  /* B — flipped: tray drops to ink, cards take the card plane */
  .t-flipped { --sheet: #080809; --card: #111113; }
  body.light .t-flipped { --sheet: #e9e9ef; --card: #ffffff; }

  /* C — raised: sheet stays, cards lift on fillFaint */
  .t-raised  { --sheet: #111113; --card: #ffffff0a; }
  body.light .t-raised  { --sheet: #ffffff; --card: #00000008; --cardlift: 0 1px 3px #0000001a; }

  /* D — deeper well: current direction, full step to the page */
  .t-deep    { --sheet: #111113; --card: #000000; }
  body.light .t-deep    { --sheet: #ffffff; --card: #dedee6; }
</style>

<h1>Sources tray — which way does the ladder run?</h1>
<p class="sub">
  Real tokens and real geometry from <code>SourcesTray.swift</code> / <code>DesignTokens.swift</code>.
  Same corpus in all four, same packing (biggest-first, 5 slots a row). Wallet is the active source.
  Toggle the theme — the light column is where the flip changes character most.
</p>

<div class="bar">
  <button id="dark" class="on">Dark</button>
  <button id="light">Light</button>
</div>

<div class="rail" id="rail"></div>

<script>
const CORPUS = [
  // packed biggest-first into 5-slot rows, exactly as SourceRowPacking would
  [{ cat: "Wallet", apps: [
      ["Wallet","W","#627eea",1], ["Peer","P","#00c48c"], ["Privacy Pools","0x","#7c5cff"],
      ["Gnosis Pay","G","#3e6957"], ["Safe","S","#12ff80"] ] }],

  [{ cat: "Life", apps: [
      ["Photos","◈","#f5a623"], ["Calendar","31","#ff3b30"], ["Reminders","☰","#ff9500"],
      ["Files","▤","#1f8fff"], ["Mail","✉","#0a84ff"] ] }],

  [{ cat: "Work", apps: [
      ["GitHub","","#2b3137"], ["Linear","L","#5e6ad2"],
      ["Stripe","S","#635bff"], ["Cursor","C","#3a3a3c"] ] }],

  [{ cat: "Media", apps: [
      ["Spotify","♫","#1db954"], ["Twitch","T","#9146ff"], ["YouTube","▶","#ff0000"] ] },
   { cat: "Social", apps: [
      ["Bluesky","B","#0085ff"], ["Farcaster","F","#8a63d2"] ] }],
];

const TREATMENTS = [
  { cls: "t-current", name: "A · Shipping today",
    note: "Tray at the card plane, cards recess to a well. This is prd §61 as written, and what every other tray does.",
    sw: "sheet #111113 · card #080809" },
  { cls: "t-flipped", name: "B · Flipped",
    note: "Tray drops to ink, cards rise to the card plane. Reads as a page holding cards — but inverts the tray convention.",
    sw: "sheet #080809 · card #111113" },
  { cls: "t-raised", name: "C · Raised card",
    note: "Tray unchanged, cards lift on fillFaint instead of recessing. Same semantics as B, no new plane.",
    sw: "sheet #111113 · card #ffffff0a" },
  { cls: "t-deep", name: "D · Deeper well",
    note: "Current direction, full step. The cards go all the way to page black instead of stopping 3% short.",
    sw: "sheet #111113 · card #000000" },
];

function chip([name, glyph, hue, active]) {
  return `<div class="chip${active ? " sel" : ""}">
    <div class="ring${active ? " active" : ""}">
      <div class="icon" style="background:${hue}">${glyph}</div>
    </div>
    <div class="chip-name${!name.includes(" ") && name.length > 7 ? " long" : ""}">${name}</div>
  </div>`;
}

function card(block) {
  return `<div class="card" style="flex:${block.apps.length} 0 0">
    <div class="cat-name">${block.cat}</div>
    <div class="chips">${block.apps.map(chip).join("")}</div>
  </div>`;
}

function panel(t) {
  const rows = CORPUS.map(r => `<div class="cardrow">${r.map(card).join("")}</div>`).join("");
  return `<section class="panel">
    <h2>${t.name}</h2>
    <div class="note">${t.note}</div>
    <div class="swatches">${t.sw}</div>
    <div class="phone">
      <div class="behind">${"<div class='row'></div>".repeat(9)}</div>
      <div class="scrim"></div>
      <div class="tray ${t.cls}">
        <div class="grabber"></div>
        <div class="title">Your sources</div>
        <div class="rows">${rows}</div>
      </div>
    </div>
  </section>`;
}

rail.innerHTML = TREATMENTS.map(panel).join("");

dark.onclick  = () => { document.body.classList.remove("light");
                        document.documentElement.style.colorScheme = "dark";
                        dark.classList.add("on"); light.classList.remove("on"); };
light.onclick = () => { document.body.classList.add("light");
                        document.documentElement.style.colorScheme = "light";
                        light.classList.add("on"); dark.classList.remove("on"); };
</script>
